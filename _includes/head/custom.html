{% if site.goatcounter_code %}
<script>
(function () {
  "use strict";

  // Honour the browser's explicit Do Not Track preference before loading any
  // analytics code. GoatCounter uses cookie-free aggregate statistics.
  var doNotTrack = navigator.doNotTrack || window.doNotTrack;
  if (doNotTrack === "1" || doNotTrack === "yes") {
    return;
  }

  window.goatcounter = {
    endpoint: "https://{{ site.goatcounter_code | escape }}.goatcounter.com/count"
  };

  var analytics = document.createElement("script");
  analytics.async = true;
  analytics.src = "https://gc.zgo.at/count.js";
  document.head.appendChild(analytics);

  var pendingEvents = [];
  function track(name) {
    var event = { path: name, event: true, no_session: true };
    if (typeof window.goatcounter.count === "function") {
      window.goatcounter.count(event);
    } else {
      pendingEvents.push(event);
    }
  }

  analytics.addEventListener("load", function () {
    pendingEvents.forEach(function (event) {
      window.goatcounter.count(event);
    });
    pendingEvents = [];
  });

  document.addEventListener("click", function (event) {
    var link = event.target.closest("a[href]");
    if (!link) {
      return;
    }

    var href = link.href;
    if (href.indexOf("mailto:") === 0) {
      track("Email Link Click");
      return;
    }

    if (link.pathname.endsWith("/cv/leo_shaposhnik_cv.pdf")) {
      track("CV Download");
      return;
    }

    if (!/^https?:$/.test(link.protocol) || link.hostname === window.location.hostname) {
      return;
    }

    var destination = "other";
    if (link.hostname === "github.com") {
      destination = "github";
    } else if (link.hostname === "arxiv.org") {
      destination = "arxiv";
    } else if (link.hostname.endsWith("linkedin.com")) {
      destination = "linkedin";
    }
    track("External Link Click: " + destination);
  });
}());
</script>
{% endif %}
<script>
document.addEventListener("DOMContentLoaded", function () {
  var containers = document.querySelectorAll(".page__content");
  var urlPattern = /https?:\/\/[^\s<]+/g;
  var skipTags = new Set(["A", "CODE", "PRE", "SCRIPT", "STYLE", "TEXTAREA"]);

  function trimUrl(match) {
    var url = match;
    var trailing = "";

    while (/[.,!?;:]+$/.test(url)) {
      trailing = url.slice(-1) + trailing;
      url = url.slice(0, -1);
    }

    while (url.endsWith(")")) {
      var opens = (url.match(/\(/g) || []).length;
      var closes = (url.match(/\)/g) || []).length;
      if (closes <= opens) {
        break;
      }
      trailing = ")" + trailing;
      url = url.slice(0, -1);
    }

    return { url: url, trailing: trailing };
  }

  function shouldSkip(node) {
    for (var el = node.parentElement; el; el = el.parentElement) {
      if (skipTags.has(el.tagName)) {
        return true;
      }
    }
    return false;
  }

  containers.forEach(function (container) {
    var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    var textNodes = [];
    var current;

    while ((current = walker.nextNode())) {
      if (!current.nodeValue || !urlPattern.test(current.nodeValue) || shouldSkip(current)) {
        urlPattern.lastIndex = 0;
        continue;
      }
      urlPattern.lastIndex = 0;
      textNodes.push(current);
    }

    textNodes.forEach(function (node) {
      var text = node.nodeValue;
      var fragment = document.createDocumentFragment();
      var lastIndex = 0;
      var match;

      urlPattern.lastIndex = 0;
      while ((match = urlPattern.exec(text)) !== null) {
        var trimmed = trimUrl(match[0]);
        var start = match.index;

        if (start > lastIndex) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex, start)));
        }

        var link = document.createElement("a");
        link.href = trimmed.url;
        link.textContent = trimmed.url;
        fragment.appendChild(link);

        if (trimmed.trailing) {
          fragment.appendChild(document.createTextNode(trimmed.trailing));
        }

        lastIndex = match.index + match[0].length;
      }

      if (lastIndex === 0) {
        return;
      }

      if (lastIndex < text.length) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      }

      node.parentNode.replaceChild(fragment, node);
    });
  });
});
</script>
